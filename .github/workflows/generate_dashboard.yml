name: Generate and Publish Weekly Dashboard

on:
  schedule:
    # 매주 금요일 오후 16:07 ~ 17:37 KST (UTC 금요일 07:07 ~ 08:37) 비정각 오프셋 15분 주기 체크
    - cron: '7,22,37,52 7 * * 5'
    - cron: '7,22,37 8 * * 5'
  workflow_dispatch:
    inputs:
      model:
        description: 'Gemini 모델 선택'
        required: false
        default: 'gemini-4-hydrogen'
        type: choice
        options:
          - 'gemini-4-hydrogen'
          - 'gemini-3.8-flash'
          - 'gemini-3.5-flash-lite'
          - 'gemini-3.5-flash'
          - 'gemini-4-argon'
      thinking_budget:
        description: 'Thinking 추론 예산 (토큰 수, 0이면 비활성화)'
        required: false
        default: '1024'
        type: string

concurrency:
  group: weekend-curator-publish
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth requests google-genai

      - name: Fetch JSON from Google Drive & Enrich via Kakao + Naver + Gemini
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API }}
          HOME_ADDRESS: ${{ secrets.HOME_ADDRESS }}
          HOME_COORDS: ${{ secrets.HOME_COORDS }}
          FAMILY_PROFILE: ${{ secrets.FAMILY_PROFILE }}
          GIRL_BIRTH_YEAR: ${{ secrets.GIRL_BIRTH_YEAR }}
          BOY_BIRTH_YEAR: ${{ secrets.BOY_BIRTH_YEAR }}
        run: |
          python scripts/sync_from_gdrive.py

      - name: Update Hub Index Data
        run: |
          python scripts/update_index.py

      - name: Commit and Push Changes to Pages
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ hub-data.json all-spots.json all-spots.html robots.txt index.html
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(dashboard): auto-generate weekly dashboard via Gemini API [skip ci]"
            git push origin main
          fi
